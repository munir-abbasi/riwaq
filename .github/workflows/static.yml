# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Runs the gates (parity + tests) on pull requests; deploy is skipped for these.
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-html-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify local/deploy HTML parity
        run: |
          if ! cmp -s index.html academic/index.html; then
            echo "Error: index.html and academic/index.html are out of sync."
            echo "Keep both files identical before deploy."
            diff -u index.html academic/index.html || true
            exit 1
          fi

  # Node test suite across the declared engines range; emits a JSON report artifact.
  test:
    strategy:
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        # The Node suite needs no browser; skip the best-effort playwright
        # postinstall (observed stalling >5 min on a slow CDN link, while the
        # install itself completes in ~96s).
        run: npm ci --ignore-scripts
      - name: Run check (parity + Node suite) with JSON report
        run: |
          npm run verify:parity
          npx vitest run tests/node/ --reporter=default --reporter=json --outputFile.json=vitest-out.json
      - name: Upload JSON test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vitest-report-node${{ matrix.node-version }}
          path: vitest-out.json
          if-no-files-found: error

  # Single deploy job since we're just deploying
  deploy:
    needs: [verify-html-parity, test]
    if: github.event_name != 'pull_request'
    # Allow only one concurrent deployment, skipping runs queued between the run
    # in-progress and latest queued. Do NOT cancel in-progress runs as we want to
    # allow these production deployments to complete. Scoped to this job so that
    # pull-request runs never serialize behind a deploy.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          # Upload only the site directory
          path: './academic'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
